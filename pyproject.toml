[project]
name = "ps-club-system"
version = "0.1.0"
description = "PS-club session, cash desk and bar tracking"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.142,<0.143",
    "uvicorn[standard]>=0.31,<0.32",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<0.30",
    "alembic>=1.13,<2",
    "apscheduler>=3.10,<4",
    "aiogram>=3.13,<4",
    "sqladmin>=0.32,<0.33",
    "python-multipart>=0.0.9,<0.1",
    "itsdangerous>=2.2,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.6,<0.7",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["core/db/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
