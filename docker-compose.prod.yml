# Production stack. Standalone: run it WITHOUT the dev override, e.g.
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# (docker-compose.override.yml is only auto-loaded when no -f is given.)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-psclub}
      POSTGRES_USER: ${POSTGRES_USER:-psclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psclub} -d ${POSTGRES_DB:-psclub}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    restart: unless-stopped
    command: sh -c "uv run alembic upgrade head && uv run uvicorn core.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-psclub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-psclub}
      BACKUP_DIR: /backups
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Only the process being up: 503 (db down) must fail it, "degraded" must not.
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    restart: unless-stopped
    command: uv run python -m core.worker.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-psclub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-psclub}
    depends_on:
      api:
        condition: service_healthy # api runs the migrations

  bot:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    restart: unless-stopped
    command: uv run python -m bot.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-psclub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-psclub}
    depends_on:
      api:
        condition: service_healthy

  backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile # postgres:16 (same major as db) + rclone
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-psclub}
      PGUSER: ${POSTGRES_USER:-psclub}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      RCLONE_CONFIG: /config/rclone/rclone.conf
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_UPLOAD_CMD: ${BACKUP_UPLOAD_CMD:-}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_REMOTE_KEEP_DAYS: ${BACKUP_REMOTE_KEEP_DAYS:-60}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      # rclone.conf with the off-machine remote (never committed; see docs/DEPLOY.md).
      # RCLONE_CONFIG points into it; a missing folder is simply created empty by Docker.
      - ${RCLONE_CONFIG_DIR:-./rclone}:/config/rclone:ro
      # Bind mount, not a named volume: dumps must be reachable from the host
      # (copy to a USB drive / sync off the machine) and survive `docker compose down -v`.
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      api:
        condition: service_healthy # the schema exists only after the api's migrations ran

  web:
    build:
      context: .
      dockerfile: docker/web.prod.Dockerfile
    restart: unless-stopped
    # No published port: only Caddy reaches nginx, so every request passes the TLS layer.
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates: losing this volume means re-issuing them (Let's Encrypt rate limits).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
